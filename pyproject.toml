[build-system]
requires = ["setuptools>=75"]
build-backend = "backend"
backend-path = ["packaging"]

[project]
name = "autoresearch-workbench"
version = "0.1.0.dev0"
description = "Self-hosted, evidence-first software performance experiments"
readme = "packaging/README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[tool.setuptools.packages.find]
where = ["product"]
include = ["autoresearch"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
autoresearch = ["_web/**/*", "_demo/*"]

[tool.pytest.ini_options]
testpaths = ["product_tests"]
pythonpath = ["product"]
addopts = "-q --tb=short"
